<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谷の割付状　二の巻 ― 天保の名主ものがたり</title>
<style>
  :root{
    --bg:#1d110d; --bg2:#26160f; --ink:#f3e6d2; --sub:#c4a58a;
    --gold:#d8a557; --line:#47291c; --card:#2a1912;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px),
      linear-gradient(180deg,#24140e,#140a07);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
    line-height:1.9; -webkit-text-size-adjust:100%; min-height:100vh;
  }
  .wrap{max-width:680px; margin:0 auto; padding:18px 18px 150px}
  .back{
    display:inline-block; font-size:16px; color:var(--ink); text-decoration:none;
    border:1px solid var(--line); border-radius:30px; padding:8px 20px; background:rgba(0,0,0,.35);
  }
  /* 本の表紙 */
  .book{position:relative; width:min(66vw,320px); aspect-ratio:15/21; margin:26px auto 8px}
  .book .edge{position:absolute; top:2%; left:-3.5%; width:5%; height:96%;
    background:repeating-linear-gradient(90deg,#d8cfbd 0 1px,#a99f8c 1px 2px); border-radius:3px 0 0 3px;
    box-shadow:-2px 4px 10px rgba(0,0,0,.5)}
  .book .cover{position:absolute; inset:0; border-radius:6px 3px 3px 6px; overflow:hidden;
    box-shadow:0 14px 30px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.6)}
  .book .cover img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover}
  .book .spine{position:absolute; top:0; bottom:0; left:0; width:7%;
    background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.18) 45%,rgba(0,0,0,.25))}
  .book .vt{position:absolute; top:7%; right:12%; writing-mode:vertical-rl; color:#f3ead6;
    font-size:min(10.5vw,52px); letter-spacing:.12em; line-height:1; text-shadow:0 2px 6px rgba(0,0,0,.45)}
  .book .vsub{position:absolute; top:8.5%; right:30%; writing-mode:vertical-rl; color:#e3d6c0;
    font-size:min(3.6vw,17px); letter-spacing:.32em; padding-right:.6em; border-right:1px solid rgba(243,234,214,.55);
    line-height:1}
  .book .author{position:absolute; left:12%; bottom:6%; color:#f3ead6; font-weight:700;
    font-size:min(4.6vw,22px); letter-spacing:.2em; text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .book .author span{margin-right:1.2em}
  .series{text-align:center; color:var(--gold); font-weight:700; letter-spacing:.3em; margin-top:26px; font-size:17px}
  h1{text-align:center; font-size:min(7vw,32px); margin:4px 0 0; letter-spacing:.08em; font-weight:700; white-space:nowrap}
  .subtitle{text-align:center; color:var(--sub); font-size:17px; letter-spacing:.08em}
  .desc{font-size:17px; margin:18px 0 22px; line-height:2}
  .playall{
    display:block; width:100%; margin:0 0 24px; padding:16px; font-size:18px; font-family:inherit; font-weight:700;
    background:linear-gradient(180deg,#e2b264,#c98d3e); color:#2a1d10; border:none; border-radius:40px; letter-spacing:.12em;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .list{list-style:none; margin:0 0 26px; padding:0}
  .list li{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    margin-bottom:10px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .list li.now{border-color:var(--gold)}
  .list .no{font-size:14px; color:var(--gold); min-width:56px}
  .list .ttl{flex:1; font-size:17px}
  .list .mark{font-size:13px; color:var(--gold); visibility:hidden}
  .list li.now .mark{visibility:visible}
  article{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 20px; margin-bottom:20px; scroll-margin-top:12px; overflow:hidden}
  .epimg{display:block; width:calc(100% + 40px); margin:-22px -20px 16px; aspect-ratio:16/10; object-fit:cover}
  article h2{font-size:20px; margin:0 0 4px; font-weight:600}
  article .era{font-size:14px; color:var(--sub); margin-bottom:12px}
  article p{margin:0 0 1em; font-size:17px; text-indent:1em; line-height:2.2}
  article p.q{text-indent:0}
  article rt{font-size:.55em; color:var(--sub)}
  article.now{border-color:var(--gold)}
  .readbtn{
    font-family:inherit; font-size:15px; padding:6px 16px; border-radius:18px;
    border:1px solid var(--gold); background:transparent; color:var(--gold); margin-bottom:12px;
  }
  footer{font-size:13px; color:var(--sub); text-align:center; margin-top:28px; line-height:1.9}
  footer .back{margin-top:16px}
  .player{
    position:fixed; left:0; right:0; bottom:0; background:rgba(24,12,8,.96);
    border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .player .in{max-width:680px; margin:0 auto}
  .player .now-ttl{font-size:14px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink)}
  .player .ctrl{display:flex; align-items:center; gap:10px}
  .player button{
    font-family:inherit; font-size:18px; width:46px; height:40px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .player button.main{background:var(--gold); color:#2a120a; border:none; width:58px}
  .player input[type=range]{flex:1; accent-color:var(--gold)}
  .player .time{font-size:12px; color:var(--sub); min-width:76px; text-align:right}
  .player .msg{font-size:12px; color:var(--gold); min-height:1em}
  .volnav{display:flex; justify-content:space-between; gap:10px; margin:26px 0 6px}
  .volnav a{flex:1; text-align:center; color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:24px; padding:10px 6px; background:rgba(0,0,0,.3); font-size:15px}
  .volnav a.off{visibility:hidden}
  .nextvol{display:none; text-align:center; margin:0 0 24px}
  .nextvol a{display:inline-block; color:#2a1d10; background:var(--gold); border-radius:30px; padding:12px 28px; text-decoration:none; font-weight:700; letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../roudoku_riaru_hondana/">‹ 本棚にもどす</a>

  <div class="book" aria-label="谷の割付状　二の巻の表紙">
    <div class="edge"></div>
    <div class="cover"><img src="images/cover_2.jpg" alt="谷の割付状　二の巻の表紙"></div>
  </div>

  <div class="series">朗読帖　第七冊</div>
  <h1>谷の割付状　二の巻</h1>
  <div class="subtitle">第二話</div>

  <p class="desc">『谷の割付状』二の巻。天保四年、山の雪が消えず、冷たい雨のつづく夏。実らない畑を前に、名主の清兵衛は代官所へ願い出る決心をします。</p>

  <button class="playall" id="playall">▶ 本をひらいて　読む・聞く</button>

  <ul class="list" id="list"></ul>

  <div id="texts"></div>

  <div class="nextvol" id="nextvol"><a href="maki3.html">三の巻へすすむ ›</a></div>

  <div class="volnav"><a class="" href="index.html">‹ 一の巻</a><a class="" href="maki3.html">三の巻 ›</a></div>

  <footer>
    この物語は、江戸時代の南相木村について確かめられた事実と、<br>
    天領の村で広く行われていた年貢のしくみをもとにした創作です。<br>
    登場人物はすべて架空の人物です。<br>
    <a class="back" href="../roudoku_riaru_hondana/">‹ 本棚にもどす</a>
  </footer>
</div>

<div class="player">
  <div class="in">
    <div class="now-ttl" id="nowttl">「本をひらいて　読む・聞く」で続けて聞けます</div>
    <div class="ctrl">
      <button id="prev" aria-label="前の話">⏮</button>
      <button id="play" class="main" aria-label="再生">▶</button>
      <button id="next" aria-label="次の話">⏭</button>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const EPISODES = [{"no": "第二話", "title": "冷たい夏", "era": "天保四年", "audio": "audio/02_tsumetai_natsu.mp3", "html": "<p>第二話。冷たい夏。</p><p><ruby>明くる<rt>あくる</rt></ruby><ruby>天保<rt>てんぽう</rt></ruby>四年は、春からおかしな年だった。</p><p>五月になっても、山の雪がなかなか消えない。六月には冷たい雨が降りつづき、<ruby>川霧<rt>かわぎり</rt></ruby>が谷をすっぽりとおおった。七月に入っても、<ruby>綿入れ<rt>わたいれ</rt></ruby>を脱げない日があった。</p><p>畑の<ruby>粟<rt>あわ</rt></ruby>は背がのびず、大豆は花がついても、<ruby>実が<rt>みが</rt></ruby>入らない。<ruby>蕎麦<rt>そば</rt></ruby>の芽は、遅い<ruby>霜<rt>しも</rt></ruby>にあたって黒くしおれた。年寄りたちは空を見あげ、こんな夏は覚えがない、と首をふった。</p><p class=\"q\">「<ruby>名主<rt>なぬし</rt></ruby>さま、うちの畑を見てくだせえ」</p><p>毎朝のように、<ruby>百姓<rt>ひゃくしょう</rt></ruby>が<ruby>清兵衛<rt>せいべえ</rt></ruby>の家の戸をたたいた。清兵衛は<ruby>与吉<rt>よきち</rt></ruby>をつれて、谷の上から下まで畑を見てまわった。どこもかしこも、葉が黄色くしおれていた。清兵衛は、畑ひとつひとつのようすを、<ruby>帳面<rt>ちょうめん</rt></ruby>に書きとめていった。</p><p>おさよの畑は、とりわけひどかった。幼い子どもたちが、母親のそでにしがみついて、しおれた畑をじっと見ていた。与吉は、かける言葉が見つからなかった。</p><p>秋になって、<ruby>割付状<rt>わりつけじょう</rt></ruby>が届いた。数字は、やはり<ruby>去年<rt>きょねん</rt></ruby>と同じだった。</p><p class=\"q\">「<ruby>定免<rt>じょうめん</rt></ruby>だからな……」</p><p><ruby>茂左衛門<rt>もざえもん</rt></ruby>がうなだれた。</p><p class=\"q\">「このままでは、正月を越せねえ家が出る」</p><p><ruby>源次<rt>げんじ</rt></ruby>の声はかすれていた。<ruby>百姓代<rt>ひゃくしょうだい</rt></ruby>は、名主や<ruby>組頭<rt>くみがしら</rt></ruby>のやり方に目を光らせ、百姓の側に立つのが役目である。源次は清兵衛の<ruby>幼なじみ<rt>おさななじみ</rt></ruby>だったが、言うべきことは遠慮なく言う男だった。</p><p class=\"q\">「清兵衛、おめえ、<ruby>御影<rt>みかげ</rt></ruby>へ行ってくれるか」</p><p><ruby>囲炉裏<rt>いろり</rt></ruby>の火が、ぱちりとはねた。清兵衛はしばらく黙っていた。お上に願い出るのは、軽いことではない。それでも、このまま黙っていては、村がもたない。</p><p>やがて清兵衛は、顔をあげた。</p><p class=\"q\">「行こう。<ruby>願書<rt>がんしょ</rt></ruby>を書く」</p><p>その晩、清兵衛は夜おそくまで筆をとった。この夏の寒さ。畑ごとの実りの少なさ。村の家々の暮らしぶり。ひとつひとつ、うそのないように書きつけた。</p><p>あくる日、名主、組頭、百姓代、そして村の百姓たちが、ひとりずつ名をつらね、<ruby>印<rt>いん</rt></ruby>を押した。おさよも、ふるえる手で印を押した。</p><p>ろうそくの灯の下で、清兵衛は願書をていねいにたたんだ。紙一枚の重さが、谷じゅうの暮らしの重さに思えた。</p>"}];
const NEXT_MSG = '二の巻を聞き終えました。次は三の巻へ';
const ALL = [{"no": "はじめに", "title": "時代と史実のこと", "audio": "audio/00_hajimeni.mp3", "maki": "一の巻", "page": "index.html"}, {"no": "第一話", "title": "割付状の届く日", "audio": "audio/01_waritsuke_jou.mp3", "maki": "一の巻", "page": "index.html"}, {"no": "第二話", "title": "冷たい夏", "audio": "audio/02_tsumetai_natsu.mp3", "maki": "二の巻", "page": "maki2.html"}, {"no": "第三話", "title": "御影への道", "audio": "audio/03_mikageno_michi.mp3", "maki": "三の巻", "page": "maki3.html"}, {"no": "第四話", "title": "峠をこえる炭", "audio": "audio/04_tougeno_sumi.mp3", "maki": "四の巻", "page": "maki4.html"}, {"no": "第五話", "title": "廻り舞台", "audio": "audio/05_mawari_butai.mp3", "maki": "五の巻", "page": "maki5.html"}];
const START = 2;

const audio = document.getElementById('audio');
const list = document.getElementById('list');
const texts = document.getElementById('texts');
const playBtn = document.getElementById('play');
const seek = document.getElementById('seek');
const timeEl = document.getElementById('time');
const nowttl = document.getElementById('nowttl');
const msg = document.getElementById('msg');
let cur = -1;   // ALL（全五巻を通した順番）の中の位置

EPISODES.forEach((ep,i)=>{
  const li = document.createElement('li');
  li.innerHTML = `<span class="no">${ep.no}</span><span class="ttl">${ep.title}</span><span class="mark">♪ 再生中</span>`;
  li.onclick = ()=>{ load(START+i,true); };
  list.appendChild(li);

  const art = document.createElement('article');
  art.id = 'ep'+i;
  art.innerHTML = `<h2>${ep.no}　${ep.title}</h2>${ep.era?`<div class="era">${ep.era}</div>`:''}<button class="readbtn">▶ この話を聞く</button>${ep.html}`;
  art.querySelector('.readbtn').onclick = ()=>{ load(START+i,true); };
  texts.appendChild(art);
});

function fmt(t){ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }
function local(){ const k = cur-START; return (k>=0 && k<EPISODES.length) ? k : -1; }

function mark(){
  const k = local();
  [...list.children].forEach((li,i)=>li.classList.toggle('now',i===k));
  [...texts.children].forEach((a,i)=>a.classList.toggle('now',i===k));
}

/* 全五巻を通して、はじめから最後まで続けて再生する */
function load(g, autoplay){
  if(g<0 || g>=ALL.length) return;
  cur = g;
  msg.textContent = '';
  const a = ALL[g];
  audio.src = a.audio;
  const k = local();
  if(k>=0){
    nowttl.textContent = a.no + '　' + a.title;
    document.getElementById('ep'+k).scrollIntoView({behavior:'smooth', block:'start'});
  }else{
    nowttl.textContent = a.maki + '　' + a.no + '　' + a.title;
    msg.textContent = 'この話の本文は「' + a.maki + '」のページにあります（再生はこのまま続きます）';
    const nv = document.getElementById('nextvol'); if(nv) nv.style.display='block';
  }
  mark();
  if(autoplay){ audio.play().catch(()=>{}); }
}

document.getElementById('playall').onclick = ()=>{ load(START,true); };
playBtn.onclick = ()=>{
  if(cur<0){ load(START,true); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
};
document.getElementById('prev').onclick = ()=>{ load(Math.max(0,cur-1),true); };
document.getElementById('next').onclick = ()=>{ if(cur<ALL.length-1) load(cur+1,true); };

audio.addEventListener('play', ()=>{ playBtn.textContent='⏸'; });
audio.addEventListener('pause', ()=>{ playBtn.textContent='▶'; });
audio.addEventListener('timeupdate', ()=>{
  if(audio.duration){ seek.value = audio.currentTime/audio.duration*100; }
  timeEl.textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
seek.addEventListener('input', ()=>{ if(audio.duration) audio.currentTime = seek.value/100*audio.duration; });
audio.addEventListener('ended', ()=>{
  if(cur < ALL.length-1){ load(cur+1,true); }
  else { playBtn.textContent='▶'; nowttl.textContent='『谷の割付状』全五巻、おわりまで聞きました'; msg.textContent=''; }
});
audio.addEventListener('error', ()=>{
  if(cur>=0) msg.textContent = 'この話の音声はまだ入っていません（' + ALL[cur].audio + '）';
});
</script>
</body>
</html>
